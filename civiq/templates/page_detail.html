{% extends "base.html" %}
{% block title %}{{ page.title }} — CIVIQ{% endblock %}
{% block content %}

<section class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-14">
  <h1 class="font-display text-3xl font-bold text-white mb-2">{{ page.title }}</h1>
  <p class="text-zinc-600 text-xs mb-10">Last updated: {{ page.updated_at|date:"d M Y" }}</p>

  <div class="prose prose-invert prose-zinc max-w-none prose-headings:font-display prose-a:text-emerald-400">
    {{ page.content|safe }}
  </div>
</section>

{% endblock %}
