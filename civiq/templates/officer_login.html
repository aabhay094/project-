{% extends "base.html" %}
{% block title %}Officer Login — CIVIQ{% endblock %}
{% block content %}

<section class="max-w-md mx-auto px-4 sm:px-6 lg:px-8 py-20">
  <div class="rounded-xl border border-white/10 bg-panel/40 p-8">
    <div class="w-12 h-12 rounded-lg bg-emerald-500/15 border border-emerald-500/30 flex items-center justify-center mb-5">
      <i data-lucide="shield" class="w-5 h-5 text-emerald-400"></i>
    </div>
    <h1 class="font-display text-2xl font-bold text-white mb-1">Officer Login</h1>
    <p class="text-zinc-500 text-sm mb-8">Restricted access for departmental officers.</p>

    {% if form.errors %}
    <div class="rounded-lg border border-red-500/30 bg-red-500/10 text-red-300 text-sm px-4 py-3 mb-5">
      Invalid username or password.
    </div>
    {% endif %}

    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="text-xs text-zinc-400 mb-1.5 block">Username</label>
        <input type="text" name="username" required class="w-full bg-base border border-white/10 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500/50">
      </div>
      <div>
        <label class="text-xs text-zinc-400 mb-1.5 block">Password</label>
        <input type="password" name="password" required class="w-full bg-base border border-white/10 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500/50">
      </div>
      <button type="submit" class="w-full inline-flex items-center justify-center gap-1.5 bg-emerald-500 hover:bg-emerald-400 text-black font-semibold px-5 py-2.5 rounded-lg text-sm transition">
        <i data-lucide="log-in" class="w-4 h-4"></i> Login
      </button>
    </form>
  </div>
</section>

{% endblock %}
